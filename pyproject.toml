# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesospim-control"
version = "1.10.2"
authors = [{ name = "Nikita Vladimirov", email = "vladimirov@hifo.uzh.ch" }, { name = "Fabian Voigt", email = "fvoigt@fas.harvard.edu" },]
description = "mesoSPIM microscope control"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"

dependencies = [
    "numpy==2.1.2",
    "scipy==1.14.1",
    "PyQt5==5.15.11",
    "PyQt5-sip==12.15.0",
    "indexed==1.3.0",
    "pandas==2.3.3",
    "pipython==2.10.2.1",
    "pyserial==3.5",
    "pyqtgraph==0.13.7",
    "pywinusb==0.4.2",
    "tifffile==2024.9.20",
    "qdarkstyle==2.8.1",
    "npy2bdv==1.0.8",
    "future==1.0.0",
    "matplotlib==3.9.2",
    "psutil>=7.0.0",
    "zarr==3.1.3",
    "scikit-learn>=1.8.0",
    "typer>=0.25.0"
]

[project.optional-dependencies]
# NI-DAQmx is only needed by setups that drive National Instruments hardware, i.e. a config
# file with 'waveformgeneration', 'shutter' or 'laser' set to 'NI' or 'cDAQ'. Demo mode runs
# without it; requirements-conda-mamba.txt still installs it directly.
ni = ["nidaqmx==1.0.1"]

[project.urls]
"Homepage" = "http://mesospim.org"
"Source code" = "https://github.com/mesoSPIM/mesoSPIM-control"

[project.scripts]
mesospim-control = "mesoSPIM.mesoSPIM_Control:run"
